<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Article | DRAFTLY</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="logo">DRAFTLY.</a>

        <div class="nav-links">
            <a href="index.html">Explore</a>
            <a href="dashboard.html">Dashboard</a>
        </div>

        <button class="btn btn-outline" data-logout>
            Log out
        </button>

    </nav>

    <main class="auth-wrapper">

        <div class="auth-card" style="max-width: 650px;">

            <span class="eyebrow">CREATE SOMETHING</span>

            <h1>Write your story.</h1>

            <p>Share an idea, experience, or perspective.</p>

            <form id="createBlogForm">

                <div class="form-group">

                    <label for="title">Article title</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Give your article a title"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="category">Category</label>

                    <select id="category" required>

                        <option value="">Select a category</option>

                        <option value="Technology">Technology</option>

                        <option value="Design">Design</option>

                        <option value="Education">Education</option>

                        <option value="Lifestyle">Lifestyle</option>

                        <option value="Travel">Travel</option>

                        <option value="Culture">Culture</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="excerpt">Short description</label>

                    <input
                        type="text"
                        id="excerpt"
                        placeholder="Write a short introduction"
                        required
                    >
                    <p class="word-counter">
    <span id="charCount">0</span> / 200 characters
</p>

                </div>

                <div class="form-group">

                    <label for="content">Your article</label>

                    <textarea
                        id="content"
                        placeholder="Start writing your story..."
                        required
                    ></textarea>
                    <p class="word-counter">
    <span id="wordCount">0</span> words
</p>

                </div>

                <button type="submit" class="btn btn-primary form-submit">
                    Publish article
                </button>

                <p id="message" class="message"></p>

            </form>

        </div>

    </main>

    <footer class="footer">
        © 2026 DRAFTLY. A space for every story.
    </footer>

</body>
</html>
